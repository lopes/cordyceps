[package]
name = "cordyceps"
version = "0.5.0"
authors = ["Joe Lopes <lopes.id>"]
description = "Rust ransomware, for learning not looting"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
clap = { version = "4.5.42", features = ["derive"] }
env_logger = "0.11.8"
hkdf = "0.12.4"
log = "0.4.27"
rand = "0.8.5"
rand_core = "0.6.4"
sha2 = "0.10.9"
thiserror = "2.0.12"
walkdir = "2.5.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
